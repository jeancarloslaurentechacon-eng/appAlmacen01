<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Ingrese un producto</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>
	
<body class="bg-light d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center mt-2">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 text-success">Registro de Producto</h3>
                        
                        <form th:action="@{/calcular}"  th:object="${producto}" method="POST" >
                            <div class="form-floating mb-3">
                                <input type="text" th:field="*{nombre}" class="form-control"  placeholder="Nombre del producto" required>
                                <label for="nombre">Nombre del producto</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" th:field="*{precio}" step="0.01" class="form-control"  placeholder="0.00" required>
                                <label for="precio">Precio (S/.)</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" th:field="*{cantidad}" class="form-control" placeholder="Cantidad" required>
                                <label for="cantidad">Cantidad</label>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2">Enviar</button>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
	
</html>
